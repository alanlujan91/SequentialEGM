[project]
name = "sequential-egm"
version = "0.1.0"
description = "Sequential Endogenous Grid Method (EGM^n) for dynamic optimization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "econ-ark>=0.15.1",
    "ipykernel>=7.1.0",
    "ipywidgets>=8",
    "jupyterlab>=4.5.9",
    "jupytext>=1.16.0",
    "matplotlib>=3.10.7",
    "mystmd>=1.11.0",
    "nbconvert>=7.17.1",
    "numba>=0.60.0",
    "numpy>=2.3.5",
    "plotly>=6",
    "pytest>=9.0.3",
    "scipy>=1.16.3",
    "sequence-jacobian>=1.0.0",
    "sympy>=1.14",
]

# mybinder.org (repo2docker) runs `pip install -e .` only when [build-system] is present;
# the project ships no package, so the install brings in the dependencies alone.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]

[tool.ruff.lint.per-file-ignores]
# @het names a hetinput's output from its return line's text, so build_l_grid
# must keep `return l_grid`; RET504's fix would inline it and rename the output.
"code/ssj/hh_egm.py" = ["RET504"]
# HARKmodels keeps HARK's CamelCase module naming (cf. ConsIndShockModel).
"code/HARKmodels/{__init__,ConsHealthSeparableModel,ConsLaborPortfolioModel,ConsLaborSeparableModel}.py" = ["N999"]

[tool.uv.sources]
econ-ark = { git = "https://github.com/econ-ark/HARK.git", branch = "main" }

[dependency-groups]
dev = [
    "cogapp>=3.6.0",
]
